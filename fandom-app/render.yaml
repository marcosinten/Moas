# Plantilla para Render (Blueprint). Solo falta pegar DATABASE_URL en el panel de Render.
services:
  - type: web
    name: fandom-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_HOURS
        value: "12"
      - key: DATABASE_URL
        sync: false
